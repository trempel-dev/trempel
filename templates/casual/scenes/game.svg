<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Game screen: the HUD on top (anchored to the top edge, kept inside the safe area by the kit),
       the world (#field) — fitted by the game into the PLAYFIELD (screen minus HUD minus safe area:
       layout.hud in main.ts, game.playfield). -->
  <rect id="bg" x="0" y="0" width="720" height="1280" fill="#1b2131" data-fill="bg" data-stretch="xy"/>
  <g id="field">
    <rect id="fieldBg" x="0" y="0" width="680" height="1080" rx="24" fill="#2a2f3a" data-fill="surface.dark"/>
    <!-- Gameplay draws here (empty in the base). -->
    <g id="board"/>
    <g id="target" transform="translate(340,540)">
      <rect x="-60" y="-60" width="120" height="120" rx="60" fill="#e5484d" data-fill="danger"/>
      <text x="0" y="14" text-anchor="middle" fill="#ffffff" font-size="40" font-weight="bold" data-font="heading">TAP</text>
    </g>
  </g>
  <g id="hud" data-anchor="0.5 0">
    <g id="scorePlate" transform="translate(130,80)" data-w="200" data-h="76">
      <rect x="-100" y="-38" width="200" height="76" rx="38" fill="#f6f7fa"/>
      <text x="0" y="12" text-anchor="middle" font-size="36">0</text>
    </g>
    <g id="timePlate" transform="translate(360,80)" data-w="150" data-h="76" data-color="accent">
      <rect x="-75" y="-38" width="150" height="76" rx="38" fill="#f6f7fa"/>
      <text x="0" y="12" text-anchor="middle" font-size="36">15</text>
    </g>
    <g id="pauseBtn" transform="translate(640,80)" data-size="88" data-icon="pause" data-fx="press" data-sound="click">
      <rect x="-44" y="-44" width="88" height="88" rx="44" fill="#e4e7ee"/>
    </g>
  </g>
</svg>
