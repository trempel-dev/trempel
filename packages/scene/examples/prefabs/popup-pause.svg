<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" width="720" height="1000">
  <rect id="dim" width="720" height="1000" fill="#000000" opacity="0.6" data-stretch="xy"/>
  <use id="pause" href="ui/panel.svg" x="60" y="100" width="600" height="800" data-title="Пауза" data-close="resume" data-anchor="0.5 0.5">
    <use id="resumeBtn" slot="content" href="ui/button.svg" x="40" y="60" width="440" data-label="Продолжить" data-action="resume"/>
    <use id="settingsBtn" slot="content" href="ui/button.svg" x="40" y="170" width="440" data-label="=t('settings')" data-action="openSettings"/>
    <use id="exitBtn" slot="content" href="ui/button-green.svg" x="40" y="280" width="440" data-label="Выход" data-action="exit"/>
    <text id="hint" slot="content" x="260" y="520" text-anchor="middle" font-size="24" fill="#5a5f7a">Игра на паузе</text>
  </use>
</svg>
