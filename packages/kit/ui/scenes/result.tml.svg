<svg xmlns="http://www.w3.org/2000/svg" xmlns:tml="https://trempel.dev/ns/scene" tml:extends="result.svg">
  <!-- Needs state.won (boolean), state.stars (0..3), state.score, state.best; actions restart(), toMenu(). -->
  <tml:ref id="frame" tml:type="ui-popup-frame" tml:bind-title="t(state.won ? 'ui.win' : 'ui.lose')"/>
  <tml:ref id="stars" tml:type="ui-stars" tml:bind-value="state.stars"/>
  <tml:ref id="score" tml:bind="t('ui.score', {n: state.score})"/>
  <tml:ref id="best" tml:bind="t('ui.best', {n: state.best})"/>
  <tml:ref id="restartBtn" tml:type="ui-button" tml:bind-text="t('ui.restart')" tml:on-click="restart()"/>
  <tml:ref id="menuBtn" tml:type="ui-button" tml:bind-text="t('ui.menu')" tml:on-click="toMenu()"/>
</svg>
