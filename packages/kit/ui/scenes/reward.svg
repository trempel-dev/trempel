<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Kit template: reward popup — what is given, claim, and ×2 for a rewarded ad (shown only when
       ads are available: kit.ads — Playables rule). -->
  <rect id="dim" x="0" y="0" width="720" height="1280" fill="#0b0e14" data-fill="dim" opacity="0.6" data-stretch="xy"/>
  <g id="content" transform="translate(360,640)" data-anchor="0.5 0.5">
    <g id="frame" data-w="580" data-h="660" data-title-w="380">
      <rect x="-290" y="-330" width="580" height="660" rx="40" fill="#f6f7fa"/>
      <text x="0" y="-314" text-anchor="middle" font-size="44" font-weight="bold" fill="#1f2430">REWARD</text>
    </g>
    <g id="icon" transform="translate(0,-130)" data-count="1" data-size="200"/>
    <text id="amount" x="0" y="40" text-anchor="middle" font-size="64" font-weight="bold" fill="#1f2430" data-color="onSurface" data-font="heading">+10</text>
    <g id="claimBtn" transform="translate(0,150)" data-w="380" data-h="100" data-variant="secondary" data-fx="press" data-sound="click">
      <rect x="-190" y="-50" width="380" height="100" rx="50" fill="#24a865"/>
      <text x="0" y="15" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">CLAIM</text>
    </g>
    <g id="doubleBtn" transform="translate(0,262)" data-w="380" data-h="88" data-variant="accent" data-fx="press" data-sound="click">
      <rect x="-190" y="-44" width="380" height="88" rx="44" fill="#ffb020"/>
      <text x="0" y="13" text-anchor="middle" font-size="36" font-weight="bold" fill="#1f2430">x2</text>
    </g>
  </g>
</svg>
