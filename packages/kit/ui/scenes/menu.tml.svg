<svg xmlns="http://www.w3.org/2000/svg" xmlns:tml="https://trempel.dev/ns/scene" tml:extends="menu.svg">
  <!-- Logic: kit components (tml:type), texts from i18n (ui.* — the kit's strings, the game may
       override them), the game's action play() and state.best. -->
  <tml:ref id="title" tml:bind="t('ui.title')"/>
  <tml:ref id="best" tml:bind="t('ui.best', {n: state.best})"/>
  <tml:ref id="playBtn" tml:type="ui-button" tml:bind-text="t('ui.play')" tml:on-click="play()"/>
  <tml:ref id="settingsBtn" tml:type="ui-icon-button" tml:on-click="popup('settings')"/>
</svg>
