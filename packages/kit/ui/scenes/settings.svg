<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Kit template: settings popup — sound and music (the kit's settings, saved by the kit).
       Popup convention: #dim over the whole canvas, #content centred (children relative to it). -->
  <rect id="dim" x="0" y="0" width="720" height="1280" fill="#0b0e14" data-fill="dim" opacity="0.6" data-stretch="xy"/>
  <g id="content" transform="translate(360,640)" data-anchor="0.5 0.5">
    <g id="frame" data-w="600" data-h="720" data-title-w="400">
      <rect x="-300" y="-360" width="600" height="720" rx="40" fill="#f6f7fa"/>
      <text x="0" y="-344" text-anchor="middle" font-size="44" font-weight="bold" fill="#1f2430">SETTINGS</text>
    </g>
    <text id="sfxLabel" x="-240" y="-218" font-size="40" font-weight="bold" fill="#1f2430" data-color="onSurface" data-font="heading">SOUND</text>
    <g id="sfxToggle" transform="translate(210,-230)" data-size="88" data-on="sound-on" data-off="sound-off" data-fx="press" data-sound="click">
      <rect x="-44" y="-44" width="88" height="88" rx="44" fill="#e4e7ee"/>
    </g>
    <g id="sfxSlider" transform="translate(0,-130)" data-w="480" data-h="36" data-segments="0">
      <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#d5d9e2"/>
    </g>
    <text id="musicLabel" x="-240" y="-8" font-size="40" font-weight="bold" fill="#1f2430" data-color="onSurface" data-font="heading">MUSIC</text>
    <g id="musicToggle" transform="translate(210,-20)" data-size="88" data-on="music-on" data-off="music-off" data-fx="press" data-sound="click">
      <rect x="-44" y="-44" width="88" height="88" rx="44" fill="#e4e7ee"/>
    </g>
    <g id="musicSlider" transform="translate(0,80)" data-w="480" data-h="36" data-segments="0">
      <rect x="-240" y="-18" width="480" height="36" rx="18" fill="#d5d9e2"/>
    </g>
    <g id="closeBtn" transform="translate(0,240)" data-w="320" data-h="96" data-variant="primary" data-fx="press" data-sound="click">
      <rect x="-160" y="-48" width="320" height="96" rx="48" fill="#3d7bfd"/>
      <text x="0" y="14" text-anchor="middle" font-size="40" font-weight="bold" fill="#ffffff">OK</text>
    </g>
  </g>
</svg>
