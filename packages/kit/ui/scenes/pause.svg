<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Kit template: pause popup (register as popups.pause — game.pause()/resume() open/close it). -->
  <rect id="dim" x="0" y="0" width="720" height="1280" fill="#0b0e14" data-fill="dim" opacity="0.6" data-stretch="xy"/>
  <g id="content" transform="translate(360,640)" data-anchor="0.5 0.5">
    <g id="frame" data-w="560" data-h="680" data-title-w="360">
      <rect x="-280" y="-340" width="560" height="680" rx="40" fill="#f6f7fa"/>
      <text x="0" y="-324" text-anchor="middle" font-size="44" font-weight="bold" fill="#1f2430">PAUSE</text>
    </g>
    <g id="resumeBtn" transform="translate(0,-160)" data-w="380" data-h="104" data-variant="primary" data-fx="press" data-sound="click">
      <rect x="-190" y="-52" width="380" height="104" rx="52" fill="#3d7bfd"/>
      <text x="0" y="15" text-anchor="middle" font-size="42" font-weight="bold" fill="#ffffff">RESUME</text>
    </g>
    <g id="restartBtn" transform="translate(0,-30)" data-w="380" data-h="96" data-variant="neutral" data-fx="press" data-sound="click">
      <rect x="-190" y="-48" width="380" height="96" rx="48" fill="#e4e7ee"/>
      <text x="0" y="14" text-anchor="middle" font-size="38" font-weight="bold" fill="#1f2430">RESTART</text>
    </g>
    <g id="menuBtn" transform="translate(0,90)" data-w="380" data-h="96" data-variant="neutral" data-fx="press" data-sound="click">
      <rect x="-190" y="-48" width="380" height="96" rx="48" fill="#e4e7ee"/>
      <text x="0" y="14" text-anchor="middle" font-size="38" font-weight="bold" fill="#1f2430">MENU</text>
    </g>
    <g id="settingsBtn" transform="translate(0,225)" data-size="88" data-icon="settings" data-fx="press" data-sound="click">
      <rect x="-44" y="-44" width="88" height="88" rx="44" fill="#e4e7ee"/>
    </g>
  </g>
</svg>
