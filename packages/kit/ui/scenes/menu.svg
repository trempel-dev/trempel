<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280">
  <!-- Kit template: main menu. Sterile base (no tml:*): geometry and appearance. Kit components are
       centred on their node (translate = centre); data-* = their look (w, h, variant, icon…); the
       rects inside are only the static mock — the component draws itself from the skin. -->
  <rect id="bg" x="0" y="0" width="720" height="1280" fill="#1b2131" data-fill="bg" data-stretch="xy"/>
  <g id="center" data-anchor="0.5 0.5">
    <text id="title" x="360" y="440" text-anchor="middle" font-size="84" font-weight="bold" fill="#f2f4f8" data-color="onBg" data-font="heading" data-fit="640">MY GAME</text>
    <text id="best" x="360" y="520" text-anchor="middle" font-size="34" fill="#9aa3b5" data-color="onBg.muted" data-font="text">BEST 0</text>
    <g id="playBtn" transform="translate(360,760)" data-w="400" data-h="112" data-variant="primary" data-fx="press" data-sound="click">
      <rect x="-200" y="-56" width="400" height="112" rx="56" fill="#3d7bfd"/>
      <text x="0" y="16" text-anchor="middle" font-size="46" font-weight="bold" fill="#ffffff">PLAY</text>
    </g>
  </g>
  <g id="settingsBtn" transform="translate(640,80)" data-anchor="1 0" data-size="96" data-icon="settings" data-fx="press" data-sound="click">
    <rect x="-48" y="-48" width="96" height="96" rx="48" fill="#e4e7ee"/>
  </g>
</svg>
