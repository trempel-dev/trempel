<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trempel Hub</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#/">Trempel Hub</a>
      <nav>
        <a href="#/" data-nav="projects">Projects</a>
        <a href="#/processes" data-nav="processes">Processes <span class="count" id="svc-count"></span></a>
        <a href="#/new" data-nav="new">New project</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
    </header>
    <main id="view" aria-live="polite"></main>
    <dialog id="dlg">
      <form method="dialog" id="dlg-form">
        <h3 id="dlg-title"></h3>
        <p id="dlg-note" class="muted"></p>
        <div id="dlg-fields"></div>
        <menu>
          <button value="cancel" type="submit" class="ghost">Cancel</button>
          <button value="ok" type="submit" id="dlg-ok">Run</button>
        </menu>
      </form>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
